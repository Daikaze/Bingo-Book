name: Build Bingo Book installer
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "styles/**"
      - "module.json"
      - "templates/**"
      - "lang/**"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Foundry module zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('module.json'))['version'])")
          mkdir -p dist pack/bingo-book
          cp module.json README.md pack/bingo-book/
          cp -R scripts styles templates lang pack/bingo-book/
          cd pack
          zip -qr "../dist/bingo-book-v11-v${VERSION}.zip" bingo-book
      - name: Commit distribution archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build Bingo Book installer from source"
            git push
          fi
