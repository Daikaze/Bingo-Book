name: Publish Bingo Book v11
on:
  push:
    paths:
      - "bingo-book-src.tar.xz"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack v0.3.0 and build installer
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bingo-book-src.tar.xz ]; then
            echo "No source archive to publish."
            exit 0
          fi
          tar -xJf bingo-book-src.tar.xz
          mkdir -p dist
          zip -qr dist/bingo-book-v11-v0.3.0.zip bingo-book
          cp -a bingo-book/. .
          rm -rf bingo-book bingo-book-src.tar.xz
      - name: Commit updated module and distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish Bingo Book v0.3.0 (Foundry v11)"
            git push
          fi
